##
  # load test 체계를 L7, WAS까지 연결
  # k6
  # ↓
  #Nginx :80
  # ↓
  #Spring Boot :8000
##

events {}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://host.docker.internal:8000; # 부하를 nginx가 proxy를 통해 boot로 전달

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Nginx 상태 수집
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow all;
        }
    }
}