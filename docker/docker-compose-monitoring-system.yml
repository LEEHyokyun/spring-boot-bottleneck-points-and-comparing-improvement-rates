services:

  k6:
    image: grafana/k6:latest
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-k6
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99)
    volumes:
      - ./scripts:/scripts:ro # volume mount
    command:
      - run
      - --out
      - experimental-prometheus-rw
      - /scripts/load-test.js
    restart: "no" ##load test를 진행하는 runtime 시점에만 동작하도록 환경 구성

  nginx:
    image: nginx:1.27
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro #local > container binding
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_DATABASE: order
      MYSQL_ROOT_PASSWORD: root #root - root

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    depends_on:
      - nginx
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-mysql-exporter
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro #local > container binding
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: spring-boot-bottleneck-points-and-comparing-improvement-rates-cadvisor
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  default:
    external: true
    name: spring-boot-bottleneck-points-and-comparing-improvement-rates-network