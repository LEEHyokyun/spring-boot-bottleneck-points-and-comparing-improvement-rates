global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "spring-boot"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8000"

  - job_name: "nginx"
    static_configs:
      - targets:
          - "nginx-exporter:9113"

  - job_name: "mysql"
    static_configs:
      - targets:
          - "mysql-exporter:9104"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"